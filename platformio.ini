[env:nucleo_f302r8]
platform = ststm32
board = nucleo_f302r8 

; Upload settings
upload_protocol = stlink

; Use custom linker script
board_build.ldscript = STM32F302R8TX_FLASH.ld

; Define STM32F302x8 for the project
build_flags = 
    -DSTM32F302x8
    -DUSE_STDPERIPH_DRIVER
    -DSTM32F30X
    -I include
    -I include/bsp
    -I lib/SPL/inc
    -I lib/CMSIS
    -Wl,-Map,output.map
    -specs=nano.specs
    -specs=nosys.specs

; Build unflags to prevent using framework files
build_unflags = 
    -I.pio/libdeps/nucleo_f302r8

; Custom source files
build_src_filter = 
    +<*>
    +<../lib/SPL/src/*.c>
    +<../startup_stm32f302r8tx.s>

; Monitor settings for UART
monitor_speed = 1000000
; monitor_port = COM3